---
- name: 베어메탈 서버 완전 자동화 (펌웨어 -> RAID -> OS 배포)
  hosts: localhost
  gather_facts: no
  
  vars:
    # --- 1. 공통 접속 정보 ---
    idrac_ip: "192.168.0.120"
    idrac_user: "root"
    idrac_password: "calvin"
    
    # --- 2. 펌웨어 정보 ---
    fw_file_path: "/Users/myuser/Downloads/SAS-RAID_Firmware.EXE"
    
    # --- 3. 스토리지 (RAID) 정보 ---
    controller_fqdd: "RAID.Integrated.1-1"
    
    # --- 4. OS 가상 미디어 (Mac 웹 서버) 정보 ---
    mac_http_ip: "192.168.0.100" 
    http_port: "8000"
    iso_filename: "rocky8_custom_ks.iso"

  tasks:
    # =========================================================================
    # [ 1단계 ] 펌웨어 업데이트 구역
    # =========================================================================
    - name: "[Phase 1] 펌웨어 업데이트 시도"
      block:
        - name: "1-1. 펌웨어 파일 업로드 및 설치 예약"
          dellemc.openmanage.idrac_firmware:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            share_name: "{{ fw_file_path }}"
            apply_update: true

        - name: "1-2. 펌웨어 적용을 위한 서버 강제 재부팅"
          uri:
            url: "https://{{ idrac_ip }}/redfish/v1/Systems/System.Embedded.1/Actions/ComputerSystem.Reset"
            method: POST
            user: "{{ idrac_user }}"
            password: "{{ idrac_password }}"
            validate_certs: no
            body_format: json
            body:
              ResetType: "ForceRestart"

        - name: "1-3. ⏳ 펌웨어 업데이트 완료 대기 (약 10분 소요)"
          # 실제 iDRAC이 Job을 완료할 때까지 스크립트를 잠시 멈춥니다.
          pause:
            minutes: 10

      rescue:
        - name: "1-Rescue. 펌웨어 대기열 초기화 (롤백)"
          dellemc.openmanage.idrac_job_queue:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            command: "DeleteAll"
        - fail: msg="🚨 펌웨어 업데이트 실패! 파이프라인을 중단합니다."

    # =========================================================================
    # [ 2단계 ] 디스크 RAID 구성 구역
    # =========================================================================
    - name: "[Phase 2] 물리 디스크 RAID 1 & 5 구성 시도"
      block:
        - name: "2-1. 기존 스토리지 설정 완벽 초기화"
          dellemc.openmanage.idrac_storage_controller:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            controller_id: "{{ controller_fqdd }}"
            command: "clear"

        - name: "2-2. OS 설치용 RAID 1 (Mirror) 가상 디스크 생성"
          dellemc.openmanage.idrac_storage_volume:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            state: "present"
            controller_id: "{{ controller_fqdd }}"
            volume_name: "OS_VD"
            volume_type: "Mirror"
            drives:
              - "Disk.Bay.0:Enclosure.Internal.0-1:{{ controller_fqdd }}"
              - "Disk.Bay.1:Enclosure.Internal.0-1:{{ controller_fqdd }}"

        - name: "2-3. 데이터용 RAID 5 (Parity) 가상 디스크 생성"
          dellemc.openmanage.idrac_storage_volume:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            state: "present"
            controller_id: "{{ controller_fqdd }}"
            volume_name: "DATA_VD"
            volume_type: "Parity"
            drives:
              - "Disk.Bay.2:Enclosure.Internal.0-1:{{ controller_fqdd }}"
              - "Disk.Bay.3:Enclosure.Internal.0-1:{{ controller_fqdd }}"
              - "Disk.Bay.4:Enclosure.Internal.0-1:{{ controller_fqdd }}"

        - name: "2-4. RAID 구성을 위한 서버 재부팅"
          dellemc.openmanage.idrac_server_action:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            power_state: "ForceRestart"

        - name: "2-5. ⏳ RAID 구성 완료 대기 (약 5분 소요)"
          # Lifecycle Controller가 디스크를 묶는 시간을 벌어줍니다.
          pause:
            minutes: 5

      rescue:
        - name: "2-Rescue. 스토리지 대기열 초기화 (롤백)"
          dellemc.openmanage.idrac_job_queue:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            command: "DeleteAll"
        - fail: msg="🚨 RAID 구성 실패! 파이프라인을 중단합니다."

    # =========================================================================
    # [ 3단계 ] OS 마운트 및 무인 설치 구역
    # =========================================================================
    - name: "[Phase 3] 가상 미디어 마운트 및 OS 배포 시도"
      block:
        - name: "3-1. 기존 가상 미디어 연결 해제"
          dellemc.openmanage.idrac_virtual_media:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            boot_to_vmedia: false
            mount: false

        - name: "3-2. 커스텀 ISO 마운트 (Mac 웹 서버 -> iDRAC)"
          dellemc.openmanage.idrac_virtual_media:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            image_url: "http://{{ mac_http_ip }}:{{ http_port }}/{{ iso_filename }}"
            mount: true
            
        - name: "3-3. ⏳ ISO 마운트 안정화 대기"
          pause:
            seconds: 15

        - name: "3-4. 1회성 CD 부팅 설정"
          uri:
            url: "https://{{ idrac_ip }}/redfish/v1/Systems/System.Embedded.1"
            method: PATCH
            user: "{{ idrac_user }}"
            password: "{{ idrac_password }}"
            validate_certs: no
            body_format: json
            body:
              Boot:
                BootSourceOverrideTarget: "Cd"
                BootSourceOverrideEnabled: "Once"
                
        - name: "3-5. 서버 전원 ON (OS 무인 설치 시작)"
          uri:
            url: "https://{{ idrac_ip }}/redfish/v1/Systems/System.Embedded.1/Actions/ComputerSystem.Reset"
            method: POST
            user: "{{ idrac_user }}"
            password: "{{ idrac_password }}"
            validate_certs: no
            body_format: json
            body:
              ResetType: "ForceRestart"
              
      rescue:
        - fail: msg="🚨 OS 가상 미디어 마운트 및 부팅 설정 실패! 파이프라인을 중단합니다."
        