---
- name: Dell iDRAC 물리 서버 RAID 1 & RAID 5 자동 구성
  hosts: localhost # Mac 로컬에서 실행
  gather_facts: no

  vars:
    idrac_ip: "192.168.0.120"
    idrac_user: "root"
    idrac_password: "calvin"
    
    # 서버에 장착된 RAID 컨트롤러의 일반적인 FQDD 이름 (장비마다 다를 수 있으나 보통 이 값을 가짐)
    controller_fqdd: "RAID.Integrated.1-1" 

  tasks:
    - name: "Task 1: 기존 RAID 설정 및 찌꺼기(Foreign Config) 완벽 초기화"
      # 새로운 서버라도 테스트 흔적이 남아있을 수 있으므로 무조건 밀어버리고 시작합니다.
      dellemc.openmanage.idrac_storage_controller:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        controller_id: "{{ controller_fqdd }}"
        command: "clear" # 모든 가상 디스크(VD) 삭제 및 초기화

    - name: "Task 2: OS 설치용 RAID 1 (Mirror) 가상 디스크 생성"
      # 첫 번째와 두 번째 디스크(Bay 0, Bay 1)를 묶어 OS 영역을 만듭니다.
      dellemc.openmanage.idrac_storage_volume:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        state: "present"
        controller_id: "{{ controller_fqdd }}"
        volume_name: "OS_VD_RAID1"
        volume_type: "Mirror" # RAID 1을 의미하는 Redfish 표준 용어
        drives:
          - "Disk.Bay.0:Enclosure.Internal.0-1:{{ controller_fqdd }}"
          - "Disk.Bay.1:Enclosure.Internal.0-1:{{ controller_fqdd }}"
      register: raid1_result

    - name: "Task 3: 데이터 보관용 RAID 5 (Parity) 가상 디스크 생성"
      # 세 번째부터 다섯 번째 디스크(Bay 2, 3, 4)를 묶어 데이터 영역을 만듭니다.
      dellemc.openmanage.idrac_storage_volume:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        state: "present"
        controller_id: "{{ controller_fqdd }}"
        volume_name: "DATA_VD_RAID5"
        volume_type: "Parity" # RAID 5를 의미하는 Redfish 표준 용어
        drives:
          - "Disk.Bay.2:Enclosure.Internal.0-1:{{ controller_fqdd }}"
          - "Disk.Bay.3:Enclosure.Internal.0-1:{{ controller_fqdd }}"
          - "Disk.Bay.4:Enclosure.Internal.0-1:{{ controller_fqdd }}"
      register: raid5_result

    - name: "Task 4: 보류 중인 작업(Job) 확인 및 강제 적용 (재부팅)"
      # 스토리지 구성은 즉시 반영되지 않고 '다음 재부팅 시 반영' 대기열에 들어갑니다.
      # iDRAC에 구성 작업을 강제로 실행하도록 지시합니다.
      dellemc.openmanage.idrac_server_action:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        power_state: "ForceRestart" # 강제 재부팅하여 RAID 구성 Job을 수행하도록 함
        