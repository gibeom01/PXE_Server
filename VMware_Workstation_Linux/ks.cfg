# ks.cfg (설치 자동화 파일)
# 언어, 키보드, 타임존 설정
lang ko_KR.UTF-8
keyboard --vckeymap=kr --xlayouts='kr'
timezone Asia/Seoul --isUtc

# 인증 및 유저 설정
rootpw --plaintext Password123!
user --name=admin --password=Password123! --plaintext --groups=wheel

# 설치 모드 (텍스트, 드라이브 초기화)
text
cdrom
bootloader --location=mbr --append="crashkernel=auto"
zerombr
clearpart --all --initlabel
autopart

# [요청사항] 네트워크 및 SSH 설정
network --bootproto=dhcp --device=eth0 --activate --onboot=on
services --enabled="sshd"

# [요청사항] SELinux 및 방화벽 설정 (Post-install)
%post
# SSH 포트 변경 (예: 60022)
sed -i 's/#Port 22/Port 60022/' /etc/ssh/sshd_config
# 방화벽 허용
firewall-offline-cmd --add-port=60022/tcp
# SELinux 포트 추가 (매우 중요)
semanage port -a -t ssh_port_t -p tcp 60022 || true
# SELinux 비활성화 원할 시 (선택사항)
# sed -i 's/SELINUX=enforcing/SELINUX=disabled/' /etc/selinux/config
%end

reboot
