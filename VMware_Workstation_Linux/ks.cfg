# Rocky Linux Kickstart 최종본
text
cdrom
lang ko_KR.UTF-8
keyboard --vckeymap=kr --xlayouts='kr'
timezone Asia/Seoul --isUtc

# 1. SELinux 완벽 비활성화
selinux --disabled

# 2. 정적 네트워크 설정 (IP, Netmask, Gateway 등은 동일하게 유지)
network --bootproto=static --ip=121.125.69.253 --netmask=255.255.255.224 --gateway=121.125.69.225 --nameserver=8.8.8.8 --device=link --activate
services --enabled="sshd"

# 인증 및 유저 설정
rootpw --plaintext !Password2026
user --name=admin --password=!Password2026 --groups=wheel
auth --enableshadow --passalgo=sha512

# 설치 모드
firstboot --disable
ignoredisk --only-use=sda
autopart --type=lvm
clearpart --none --initlabel
reboot

# 3. 필수 패키지 설치 구역 (CentOS와 유일하게 다른 부분)
%packages
@^minimal-environment
openssh-server
sysstat
chrony
%end

# 4. 설치 후 사후 설정 (포트, 방화벽, 데몬)
%post --log=/root/ks-post.log
export PATH=/sbin:/bin:/usr/sbin:/usr/bin

# SSH 포트 변경 (60022)
sed -i 's/#Port 22/Port 60022/' /etc/ssh/sshd_config
sed -i 's/Port 22/Port 60022/' /etc/ssh/sshd_config

# 방화벽(firewalld) 비활성화
systemctl disable firewalld.service

# sysstat 데몬 활성화
systemctl enable sysstat.service

# chronyd 데몬 활성화
systemctl enable chronyd.service
%end
