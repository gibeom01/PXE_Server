# rocky_ks.cfg
# 1. 설치 모드 및 기본 설정
install
cdrom
lang en_US.UTF-8
keyboard us
timezone Asia/Seoul

# 2. 네트워크 (설치 중 임시로 DHCP를 받아오고, 나중에 Ansible이 고정 IP로 변경)
network --bootproto=dhcp --device=link --activate

# 3. 보안 (Root 패스워드 설정: LinuxP@ss123! / 방화벽 기본 오픈)
rootpw --plaintext LinuxP@ss123!
firewall --disabled
selinux --permissive

# 4. 디스크 파티션 (RAID로 묶인 단일 볼륨 sda를 자동으로 밀고 설치)
bootloader --location=mbr --boot-drive=sda
clearpart --all --initlabel --drives=sda
autopart --type=lvm

# 5. 설치 후 재부팅
reboot

# 6. 최소 패키지 설치 및 SSH 서버 활성화
%packages
@^minimal-environment
openssh-server
%end

# 7. Post 설치 스크립트 (SSH Root 접속 허용)
%post
sed -i 's/#PermitRootLogin yes/PermitRootLogin yes/g' /etc/ssh/sshd_config
systemctl enable sshd
%end
