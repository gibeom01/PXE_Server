# 네트워크 대역 변경 (예: 192.168.56.0 → 10.0.0.0

# defaults/main.yml (가장 중요):
pxe_network: "10.0.0.0"      # 변경
pxe_netmask: "255.255.255.0"
pxe_gateway: "10.0.0.1"      # 변경
pxe_range_start: "10.0.0.50" # 변경
pxe_range_end: "10.0.0.100"  # 변경
pxe_server_ip: "10.0.0.10"   # PXE 서버 고정 IP 변경

# templates/dnsmasq.conf.j2:
dhcp-range={{ pxe_range_start }},{{ pxe_range_end }},{{ pxe_netmask }},{{ pxe_gateway }},12h
dhcp-option=3,{{ pxe_gateway }}
dhcp-option=6,{{ pxe_gateway }}

# templates/pxelinux.cfg.j2:
append ... ip={{ pxe_server_ip }}::

# firewalld 태스크: pxe_server_ip 변수가 자동 반영됨.

# 재적용: ansible-playbook site.yml --limit pxe_servers → PXE 서버 재시작.

---
# OS 종류 변경 시 수정 부분
# 1) Linux → Linux (Rocky 8 → CentOS 7 등)

# defaults/main.yml:
rocky_version: "7.9"  # CentOS 버전
rocky_base_url: "http://{{ pxe_server_ip }}/centos7/"  # ISO 디렉터리 이름 변경

# tasks/main.yml의 unarchive:
src: "/path/to/CentOS-7-x86_64-Minimal.iso"
dest: "{{ http_root }}/centos7/"  # 변경

# templates/rocky8.cfg.j2 → centos7.cfg.j2로 이름 변경, 내용은 Kickstart 문법 거의 동일.
# pxelinux.cfg.j2: inst.stage2={{ rocky_base_url }} 자동 반영.

# 2) Linux → Windows (WDS 사용)

# Ansible: Linux role → Windows 역할로 완전 교체.
# Windows 전용 역할 (PowerShell DSC 또는 WinRM Ansible)
roles/
└── wds_server/
    ├── tasks/
    │   └── main.yml      # WDS, DHCP, IIS 설치
    └── templates/
        └── unattend.xml.j2  # Windows 무인 설치

# tasks/main.yml 예시:
- name: WDS 설치
  win_feature:
    name: WDS
    state: present
- name: DHCP 설치
  win_feature:
    name: DHCP
    state: present
- name: IIS + WDS 콘텐츠 복사
  win_copy: ... 
# 클라이언트 VM: firmware = "bios" 또는 UEFI, PXE 부팅 시 WDS 메뉴 선택.
# Windows 한계: Ansible WinRM 연결이 VMware에서 까다로움 → 설치 후 RDP로 수동 WDS 구성 추천.

# 변경 순서 및 검증
변경 유형	                  Terraform 변경	                    Ansible 변경	                                         검증 순서
네트워크 대역	               VMnet 새로 만들기, network_name 변수	  defaults/main.yml 모든 IP, dnsmasq.conf.j2	           1. terraform apply  1. 테라폼 적용
                                                                                                                   2. ansible-playbook  2. 앤서블 플레이북
                                                                                                                   3. 클라이언트 PXE F12 → DHCP 할당 확인
Linux→Linux  리눅스→리눅스	 ISO 경로만	                          defaults 버전/URL, unarchive src/dest, Kickstart 템플릿	 1. 새 ISO 복사
                                                                                                                   2. ansible-playbook  2. 앤서블 플레이북
                                                                                                                   3. http://PXESERVER/ks/ 확인
Linux→Windows  리눅스→윈도우 guest_os_type, Windows ISO         전체 role 교체 (wds_server 역할)                          1. terraform apply (Windows 설치)
                          게스트 OS 유형, Windows ISO                                                                 1. Terraform 적용 (Windows 설치)
                                                                                                                   2. RDP로 WDS/DHCP/IIS 수동 설정
                                                                                                                   3. 클라이언트 PXE

# 변수 동기화 팁: Terraform outputs.tf에서 PXE 서버 IP/MAC 출력 → ansible-inventory --list 또는 lookup()으로 Ansible vars에 주입.