---
- name: Lenovo SR630 RAID 1 미러링 자동 구성 (Redfish API)
  hosts: localhost
  gather_facts: no

  vars:
    xcc_ip: "10.10.10.130"
    xcc_user: "USERID"
    xcc_password: "Passw0rd123!"
    # 레노버의 일반적인 스토리지 인덱스는 보통 1번입니다.
    storage_id: "1" 

  tasks:
    - name: "Task 1: 1.2TB 디스크 2개로 RAID 1 볼륨 생성"
      uri:
        url: "https://{{ xcc_ip }}/redfish/v1/Systems/1/Storage/{{ storage_id }}/Volumes"
        method: POST
        user: "{{ xcc_user }}"
        password: "{{ xcc_password }}"
        validate_certs: no
        status_code: [200, 201, 202]
        body_format: json
        body:
          Name: "OS_DATA_RAID1"
          VolumeType: "Mirrored"
          Drives:
            - {"@odata.id": "/redfish/v1/Systems/1/Storage/{{ storage_id }}/Drives/1"}
            - {"@odata.id": "/redfish/v1/Systems/1/Storage/{{ storage_id }}/Drives/2"}

    - name: "Task 2: RAID 구성 적용을 위한 재부팅"
      uri:
        url: "https://{{ xcc_ip }}/redfish/v1/Systems/1/Actions/ComputerSystem.Reset"
        method: POST
        user: "{{ xcc_user }}"
        password: "{{ xcc_password }}"
        validate_certs: no
        body_format: json
        body:
          ResetType: "ForceRestart"
          