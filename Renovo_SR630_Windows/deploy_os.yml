---
- name: Lenovo SR630 가상 CD 마운트 및 OS 무인 설치 부팅
  hosts: localhost
  gather_facts: no

  vars:
    xcc_ip: "10.10.10.130"
    xcc_user: "USERID"
    xcc_password: "Passw0rd123!"
    mac_http_ip: "192.168.0.100" 
    http_port: "8000"
    iso_filename: "Windows_Server_2019_Auto.iso"

  tasks:
    - name: "Task 1: 기존 마운트된 미디어 해제 (Eject)"
      uri:
        url: "https://{{ xcc_ip }}/redfish/v1/Managers/1/VirtualMedia/1/Actions/VirtualMedia.EjectMedia"
        method: POST
        user: "{{ xcc_user }}"
        password: "{{ xcc_password }}"
        validate_certs: no
        status_code: [200, 204]
      ignore_errors: yes

    - name: "Task 2: Mac HTTP 서버의 커스텀 ISO 마운트 (Insert)"
      uri:
        url: "https://{{ xcc_ip }}/redfish/v1/Managers/1/VirtualMedia/1/Actions/VirtualMedia.InsertMedia"
        method: POST
        user: "{{ xcc_user }}"
        password: "{{ xcc_password }}"
        validate_certs: no
        body_format: json
        body:
          Image: "http://{{ mac_http_ip }}:{{ http_port }}/{{ iso_filename }}"
          Inserted: true

    - name: "Task 3: 다음 1회성 부팅을 CD/DVD로 강제 지정"
      uri:
        url: "https://{{ xcc_ip }}/redfish/v1/Systems/1"
        method: PATCH
        user: "{{ xcc_user }}"
        password: "{{ xcc_password }}"
        validate_certs: no
        body_format: json
        body:
          Boot:
            BootSourceOverrideTarget: "Cd"
            BootSourceOverrideEnabled: "Once"
      
    - name: "Task 4: OS 설치 시작 (서버 켜기/재부팅)"
      uri:
        url: "https://{{ xcc_ip }}/redfish/v1/Systems/1/Actions/ComputerSystem.Reset"
        method: POST
        user: "{{ xcc_user }}"
        password: "{{ xcc_password }}"
        validate_certs: no
        body_format: json
        body:
          ResetType: "ForceRestart"
          