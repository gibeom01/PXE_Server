---
- name: Lenovo SR630 XCC 펌웨어 업데이트 (Redfish API)
  hosts: localhost
  gather_facts: no
  
  vars:
    xcc_ip: "10.10.10.130"
    xcc_user: "USERID"
    xcc_password: "Passw0rd123!"
    fw_file_url: "http://192.168.0.100:8000/lnvgy_fw_xcc_teei_anyos.uxz"

  tasks:
    - name: "Task 1: XCC 펌웨어 업데이트 패키지 푸시 (Redfish Simple Update)"
      uri:
        url: "https://{{ xcc_ip }}/redfish/v1/UpdateService/Actions/UpdateService.SimpleUpdate"
        method: POST
        user: "{{ xcc_user }}"
        password: "{{ xcc_password }}"
        validate_certs: no
        body_format: json
        body:
          ImageURI: "{{ fw_file_url }}"

    - name: "Task 2: 펌웨어 적용을 위한 서버 강제 재부팅"
      uri:
        url: "https://{{ xcc_ip }}/redfish/v1/Systems/1/Actions/ComputerSystem.Reset"
        method: POST
        user: "{{ xcc_user }}"
        password: "{{ xcc_password }}"
        validate_certs: no
        body_format: json
        body:
          ResetType: "ForceRestart"
          