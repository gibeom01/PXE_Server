---
- name: PXE 서버 구축
  hosts: pxe_servers  # Terraform으로 만든 VM 대상
  become: yes
  roles:
    - pxe_server
  vars:
    pxe_server_ip: "{{ ansible_default_ipv4.address }}"

# ansible-playbook -i inventory site.yml 실행 후 클라이언트 VM에서 PXE 부팅 확인. 브라우저로 http://192.168.56.10/ks/rocky8-hpe.cfg 접근 테스트.

# 이 role로 VMware 환경에서 완벽히 동작하면, 실제 서버 DHCP 범위만 바꿔 재사용 가능합니다.