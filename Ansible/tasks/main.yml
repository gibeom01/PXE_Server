---
- name: 설치 필수 패키지
  dnf:
    name:
      - dnsmasq          # DHCP + TFTP 통합
      - nginx             # HTTP for Kickstart/ISO
      - syslinux-tftpboot # pxelinux.0 등
      - xinetd            # TFTP 데몬 (dnsmasq 대체 가능)
    state: present

- name: Rocky ISO 마운트 및 복사 (HTTP 제공용)
  unarchive:
    src: "/path/to/Rocky-{{ rocky_version }}-x86_64-minimal.iso"
    dest: "{{ http_root }}/rocky{{ rocky_version }}/"
    remote_src: yes
  when: rocky_iso_path is defined

- name: TFTP 디렉터리 및 PXE 파일 복사
  copy:
    src: "{{ item.src }}"
    dest: "{{ tftp_root }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: '/usr/share/syslinux/pxelinux.0', dest: '.' }
    - { src: '/usr/share/syslinux/ldlinux.c32', dest: '.' }
    - { src: '/usr/share/syslinux/menu.c32', dest: '.' }
  notify: restart tftp

- name: dnsmasq.conf 배포
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    mode: 0644
  notify: 
    - restart dnsmasq
    - restart nginx

- name: pxelinux.cfg 배포 (PXE 메뉴)
  template:
    src: pxelinux.cfg.j2
    dest: "{{ tftp_root }}/pxelinux.cfg/default"
    mode: 0644
  notify: restart tftp

- name: Kickstart 파일 배포 (HPE/Dell/Lenovo 별)
  template:
    src: "rocky{{ rocky_version }}.cfg.j2"
    dest: "{{ http_root }}/ks/rocky{{ rocky_version }}-{{ item }}.cfg"
  loop:
    - hpe
    - dell
    - lenovo
  notify: restart nginx

- name: 방화벽 포트 개방
  firewalld:
    port: "{{ item }}/udp"
    permanent: yes
    state: enabled
    immediate: yes
  loop:
    - "{{ pxe_server_ip }}:67"  # DHCP
    - "{{ pxe_server_ip }}:69"  # TFTP
  notify: reload firewalld

- name: 서비스 활성화 및 시작
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - dnsmasq
    - nginx
    - xinetd

# dnsmasq를 쓰면 DHCP+TFTP를 한 번에 처리해 간단합니다.