---
- name: Dell (13G) R630 iDRAC8 펌웨어 업데이트 (에러 처리 포함)
  hosts: localhost # Mac 로컬에서 실행하여 iDRAC으로 API를 쏘는 방식
  gather_facts: no
  
  vars:
    # 1. iDRAC 접속 정보 (직접 연결된 상태의 IP와 계정)
    idrac_ip: "192.168.0.120"
    idrac_user: "root"
    idrac_password: "calvin" # 또는 태그에 적힌 비밀번호

    # 2. 적용할 펌웨어 파일의 로컬 경로 (Mac에 다운로드 받아둔 파일 경로)
    # 예: Dell 지원 사이트에서 받은 RAID 컨트롤러(PERC) 업데이트 파일
    fw_file_path: "/Users/myuser/Desktop/Dell(13G)_iDRAC8_R630_Windows/Firmware/SAS-RAID_Firmware_XXXXX.EXE"

  tasks:
    # ---------------------------------------------------------
    # 1. 정보 수집 (단순 조회는 에러가 잘 나지 않으므로 block 밖에 둡니다)
    # ---------------------------------------------------------
    - name: "Task 1: 현재 iDRAC 및 시스템의 전체 펌웨어 인벤토리 수집"
      dellemc.openmanage.idrac_firmware_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
      register: fw_inventory

    # ---------------------------------------------------------
    # 2. 안전 실행 구역 (여기가 핵심입니다. 기존 코드를 block 안에 넣습니다)
    # ---------------------------------------------------------
    - name: "펌웨어 업데이트 안전 실행 구역 (Try)"
      block:
        - name: "Task 2: 새 펌웨어 파일 업로드 및 설치 예약 (Job 생성)"
          dellemc.openmanage.idrac_firmware:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            share_name: "{{ fw_file_path }}" # 로컬 파일 경로 지정
            apply_update: true                # 업로드 후 바로 업데이트 Job을 생성
          register: fw_update_job

        - name: "Task 3: 펌웨어 적용을 위한 서버 강제 재부팅 (Power Cycle)"
          dellemc.openmanage.idrac_server_action:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            power_state: "ForceRestart" # 강제로 껐다 켭니다.

      # ---------------------------------------------------------
      # 3. 에러 복구 구역 (위 block 안에서 단 하나라도 실패하면 즉시 여기로 넘어옵니다)
      # ---------------------------------------------------------
      rescue:
        - name: "Rescue 1: iDRAC Job Queue 강제 초기화 (꼬인 대기열 롤백)"
          dellemc.openmanage.idrac_job_queue:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            command: "DeleteAll"

        - name: "Rescue 2: 파이프라인 명시적 중단 (Fail)"
          fail:
            msg: "🚨 [장애 발생] 펌웨어 업데이트 중 심각한 오류가 발생하여 작업을 롤백했습니다. 대상 서버({{ idrac_ip }})의 상태를 수동으로 확인해 주세요."
