---
- name: Dell 13G(R630) iDRAC8 OS 무인 설치 부팅
  hosts: localhost  # Mac 로컬에서 실행
  gather_facts: no

  vars:
    # 1. iDRAC 접속 정보
    idrac_ip: "10.10.10.120"
    idrac_user: "idrac_admin"
    idrac_password: "IdracP@ss123!"
    
    # 2. Mac(Control Node)의 정보
    # 1:1 연결 시 Mac의 이더넷 어댑터에 설정한 IP 주소입니다.
    mac_http_ip: "192.168.0.100" 
    http_port: "8000"
    iso_filename: "Windows_Server_2019_Auto.iso"  # Kickstart 정보가 주입된 커스텀 ISO

  tasks:
    - name: "Task 1: 기존 가상 미디어 연결 해제"
      dellemc.openmanage.idrac_virtual_media:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        boot_to_vmedia: false # 부팅 설정 해제
        mount: false          # 언마운트

    - name: "Task 2: Mac의 HTTP 서버에서 커스텀 ISO 마운트"
      dellemc.openmanage.idrac_virtual_media:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        image_url: "http://{{ mac_http_ip }}:{{ http_port }}/{{ iso_filename }}"
        mount: true

    - name: "Task 3: 마운트 안정화 대기"
      pause:
        seconds: 25 # 13G는 네트워크 마운트에 시간이 조금 더 걸립니다.

    - name: "Task 4: 가상 CD로 1회성 부팅 설정 및 재부팅 (13G 최적화 방식)"
      # 서버가 재부팅될 때 하드디스크나 네트워크(PXE)가 아닌 방금 꽂은 가상 CD로 부팅되게 합니다.
      dellemc.openmanage.idrac_os_deployment:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        boot_to_network_iso: true # 가상 미디어로 부팅하도록 지시
        iso_image: "http://{{ mac_http_ip }}:{{ http_port }}/{{ iso_filename }}"
        