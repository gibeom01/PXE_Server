---
- name: HPE Gen11 iLO 6 펌웨어 업데이트 (인벤토리 수집 및 안전장치 포함)
  hosts: localhost  # Mac 로컬에서 실행하여 iLO 6로 API를 쏘는 방식
  gather_facts: no
  
  vars:
    # 1. iLO 6 접속 정보 (직접 연결된 상태의 IP와 계정)
    ilo_ip: "10.10.10.140"
    ilo_user: "Administrator"
    ilo_password: "iLoPassw0rd123!"

    # 2. 적용할 펌웨어 파일의 로컬 경로 (Mac에 다운로드 받아둔 파일 경로)
    # 예: HPE 지원 사이트에서 받은 RAID 컨트롤러(PERC) 업데이트 파일
    fw_file_url: "http://192.168.0.100:8000/CPXXXXXX.exe"

  tasks:
    # ---------------------------------------------------------
    # 1. 정보 수집 (단순 조회는 에러가 잘 나지 않으므로 block 밖에 둡니다)
    # ---------------------------------------------------------
    - name: "Task 1: 현재 iLO 및 시스템의 전체 펌웨어 인벤토리 수집"
      uri:
        url: "https://{{ ilo_ip }}/redfish/v1/UpdateService/FirmwareInventory"
        method: GET
        user: "{{ ilo_user }}"
        password: "{{ ilo_password }}"
        validate_certs: no
        return_content: yes
      register: fw_inventory

    # ---------------------------------------------------------
    # 2. 안전 실행 구역 (여기가 핵심입니다. 기존 코드를 block 안에 넣습니다)
    # ---------------------------------------------------------
    - name: "펌웨어 업데이트 안전 실행 구역 (Try)"
      block:
        - name: "Task 2: iLO 펌웨어 업데이트 파일 푸시 및 설치 예약"
          uri:
            url: "https://{{ ilo_ip }}/redfish/v1/UpdateService/Actions/UpdateService.SimpleUpdate"
            method: POST
            user: "{{ ilo_user }}"
            password: "{{ ilo_password }}"
            validate_certs: no
            body_format: json
            body:
              ImageURI: "{{ fw_file_url }}"

        - name: "Task 3: 펌웨어 적용을 위한 서버 강제 재부팅"
          uri:
            url: "https://{{ ilo_ip }}/redfish/v1/Systems/1/Actions/ComputerSystem.Reset"
            method: POST
            user: "{{ ilo_user }}"
            password: "{{ ilo_password }}"
            validate_certs: no
            body_format: json
            body:
              ResetType: "ForceRestart"

      # ---------------------------------------------------------
      # 장애 발생 시 실행되는 에러 복구 구역
      # ---------------------------------------------------------
      rescue:
        - name: "Rescue 1: iLO 매니저 강제 재시작 (작업 큐 강제 초기화 및 롤백)"
          # 업데이트가 꼬였을 때 iLO 자체를 리셋하여 비정상 상태를 클리어합니다.
          uri:
            url: "https://{{ ilo_ip }}/redfish/v1/Managers/1/Actions/Manager.Reset"
            method: POST
            user: "{{ ilo_user }}"
            password: "{{ ilo_password }}"
            validate_certs: no
            body_format: json
            body:
              ResetType: "ForceRestart"
          ignore_errors: yes

        - name: "Rescue 2: 파이프라인 명시적 중단 (Fail)"
          fail:
            msg: "🚨 [장애 발생] HPE 펌웨어 업데이트 중 심각한 오류가 발생하여 iLO 초기화를 시도했습니다. 서버({{ ilo_ip }}) 상태를 수동으로 확인해 주세요."
