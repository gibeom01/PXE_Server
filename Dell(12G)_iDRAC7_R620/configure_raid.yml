---
- name: Dell 12G(R620) iDRAC7 RAID 1 자동 구성
  hosts: localhost
  gather_facts: no

  vars:
    idrac_ip: "10.10.10.120"
    idrac_user: "idrac_admin"
    idrac_password: "IdracP@ss123!"
    # R620의 일반적인 RAID 컨트롤러 (PERC H710 / H710P Mini)
    controller_fqdd: "RAID.Integrated.1-1" 

  tasks:
    - name: "Task 1: 기존 RAID 설정(Foreign Config) 초기화"
      dellemc.openmanage.idrac_storage_controller:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        controller_id: "{{ controller_fqdd }}"
        command: "clear"

    - name: "Task 2: 1.2TB 디스크 2개로 RAID 1(Mirror) 생성"
      dellemc.openmanage.idrac_storage_volume:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        state: "present"
        controller_id: "{{ controller_fqdd }}"
        volume_name: "OS_DATA_RAID1"
        volume_type: "Mirror"
        drives:
          - "Disk.Bay.0:Enclosure.Internal.0-1:{{ controller_fqdd }}"
          - "Disk.Bay.1:Enclosure.Internal.0-1:{{ controller_fqdd }}"

    - name: "Task 3: 구성 적용을 위한 서버 강제 재부팅 (Job 수행)"
      dellemc.openmanage.idrac_server_action:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: no
        power_state: "ForceRestart"
        