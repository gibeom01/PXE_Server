---
- name: Windows Server 기본 환경 셋팅 (Req 2 ~ Req 6)
  hosts: windows_servers # inventory에 등록된 Windows IP (예: 192.168.50.10)
  gather_facts: no
  vars:
    ansible_user: "Administrator"
    ansible_password: "WinP@ss123!"
    ansible_connection: "winrm"
    ansible_winrm_server_cert_validation: ignore
    
    new_rdp_port: 33899 # 변경할 원격 포트

  tasks:
    # ---------------------------------------------------------
    # 조건 2. sa 사용자 계정 사용 안 함 (lusrmgr.msc)
    # ---------------------------------------------------------
    - name: "Task 2: 'sa' 사용자 계정 비활성화"
      win_user:
        name: "sa"
        account_disabled: yes
        state: present

    # ---------------------------------------------------------
    # 조건 3. 네트워크 대역, IP, DNS, NetBIOS 설정 (ncpa.cpl)
    # ---------------------------------------------------------
    - name: "Task 3-1: 고정 IP, Subnet, Gateway 설정"
      win_shell: |
        $adapter = Get-NetAdapter | Where-Object {$_.Status -eq "Up"} | Select-Object -First 1
        New-NetIPAddress -InterfaceAlias $adapter.Name -IPAddress "192.168.50.10" -PrefixLength 24 -DefaultGateway "192.168.50.1" -AddressFamily IPv4
      ignore_errors: yes # 이미 IP가 설정되어 세션이 끊기는 것을 방지

    - name: "Task 3-2: SK IDC DNS 설정"
      win_dns_client:
        adapter_names: "*"
        ipv4_addresses:
          - "219.250.36.130"
          - "210.220.163.82"

    - name: "Task 3-3: NetBIOS over TCP/IP 사용 안 함"
      win_shell: |
        $adapter = Get-NetAdapter | Where-Object {$_.Status -eq "Up"} | Select-Object -First 1
        Set-NetAdapterBinding -Name $adapter.Name -ComponentID "ms_netbios" -Enabled $false

    # ---------------------------------------------------------
    # 조건 4. RDP 포트 레지스트리 변경 (regedit)
    # ---------------------------------------------------------
    - name: "Task 4: RDP 포트를 {{ new_rdp_port }}로 변경 (레지스트리 2곳)"
      win_regedit:
        path: "{{ item }}"
        name: PortNumber
        data: "{{ new_rdp_port }}"
        type: dword
      loop:
        - "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\Wds\\rdpwd\\Tds\\tcp"
        - "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp"

    # ---------------------------------------------------------
    # 조건 5. 방화벽 인바운드 룰 추가 (firewall.cpl)
    # ---------------------------------------------------------
    - name: "Task 5: 변경된 RDP 포트 방화벽 허용 (원격연결_Port)"
      win_firewall_rule:
        name: "원격연결_Port"
        localport: "{{ new_rdp_port }}"
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: yes

    # ---------------------------------------------------------
    # 조건 6. 원격 접속 허용 설정 (sysdm.cpl)
    # ---------------------------------------------------------
    - name: "Task 6: 원격 데스크톱 연결(RDP) 기능 활성화"
      win_regedit:
        path: "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server"
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: "완료 후 Windows 재부팅 (포트 변경 및 네트워크 적용을 위해)"
      win_reboot:
        reboot_timeout: 300
        