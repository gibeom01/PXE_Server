---
- name: Dell 12G(R620) iDRAC7 펌웨어 업데이트
  hosts: localhost # Mac 로컬에서 실행하여 iDRAC으로 API를 쏘는 방식
  gather_facts: no
  
  vars:
    # 1. iDRAC 접속 정보 (직접 연결된 상태의 IP와 계정)
    idrac_ip: "192.168.0.120"
    idrac_user: "root"
    idrac_password: "calvin" # 또는 태그에 적힌 비밀번호

    # 2. 적용할 펌웨어 파일의 로컬 경로 (Mac에 다운로드 받아둔 파일 경로)
    # 12G 펌웨어 파일 예시 (Windows 32비트용 DUP 파일인 경우가 많습니다)
    fw_file_path: "/Users/myuser/Desktop/Dell(12G)_iDRAC7_R620_Windows/Firmware/SAS-RAID_Firmware_XXXXX.EXE"

  tasks:
    # ---------------------------------------------------------
    # 1. 안전 실행 구역 (여기가 핵심입니다. 기존 코드를 block 안에 넣습니다)
    # ---------------------------------------------------------
    - name: "펌웨어 업데이트 안전 실행 구역 (12G WS-Man 환경)"
      block:
        - name: "Task 1: 새 펌웨어 파일 업로드 및 설치 예약"
          dellemc.openmanage.idrac_firmware:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            share_name: "{{ fw_file_path }}" # 로컬 파일 경로 지정
            apply_update: true                # 업로드 후 바로 업데이트 Job을 생성
          register: fw_update_job

        - name: "Task 2: 펌웨어 적용을 위한 서버 강제 재부팅 (12G 호환성 확보)"
          # 12G는 모듈 오류가 잦아 가장 원초적인 RACADM 명령을 SSH를 통해 우회하여 쏘는 방식을 섞어 쓰는 경우도 많으나, 일단 공식 모듈 사용
          dellemc.openmanage.idrac_server_action:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            power_state: "ForceRestart" # 강제로 껐다 켭니다.

      # ---------------------------------------------------------
      # 2. 에러 복구 구역 (위 block 안에서 단 하나라도 실패하면 즉시 여기로 넘어옵니다)
      # ---------------------------------------------------------
      rescue:
        - name: "Rescue 1: iDRAC Job Queue 강제 초기화 (꼬인 대기열 롤백)"
          dellemc.openmanage.idrac_job_queue:
            idrac_ip: "{{ idrac_ip }}"
            idrac_user: "{{ idrac_user }}"
            idrac_password: "{{ idrac_password }}"
            validate_certs: no
            command: "DeleteAll"

        - name: "Rescue 2: 파이프라인 명시적 중단 (Fail)"
          fail:
            msg: "🚨 [장애 발생] 펌웨어 업데이트 중 심각한 오류가 발생하여 작업을 롤백했습니다. 대상 서버({{ idrac_ip }})의 상태를 수동으로 확인해 주세요."
